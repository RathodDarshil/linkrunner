name: linkrunner
description: "Linkrunner mobile measurement partner (MMP) SDK for Flutter: install attribution, deferred deep linking, in-app events, revenue and SKAN for iOS and Android."
version: 5.0.0
homepage: "https://www.linkrunner.io/"
repository: "https://github.com/RathodDarshil/linkrunner_flutter"
documentation: "https://docs.linkrunner.io/sdk/flutter"
topics:
    - attribution
    - deep-linking
    - mmp
    - analytics
    - marketing

environment:
    sdk: ">=3.3.0 <4.0.0"
    flutter: ">=3.19.0"

dependencies:
    flutter:
        sdk: flutter

flutter:
    plugin:
        platforms:
            android:
                package: io.linkrunner.flutter
                pluginClass: LinkrunnerPlugin
            ios:
                pluginClass: LinkrunnerPlugin

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^4.0.0
